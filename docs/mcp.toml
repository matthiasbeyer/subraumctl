# MCP defaults. Permissions apply only to the MCP server.
# r = read only; w = read and write; x = disabled.
[tools]
dmx = "w"
white_light = "w"
outlet = "x"
alert = "w"
system = "w" # Set to x to prohibit room-system on/off commands.
knob = "w"
heizung = "w"
climate = "r" # Measured room temperature/humidity; x disables climate reads.
power = "r" # Meter power by phase and total; x disables power reads.
smoothiesaur = "x"
pizzamat = "w" # r exposes orders/services only; x disables Pizzamat.
status = "r"
publish = "x" # w allows ANY MQTT topic/payload, bypassing other groups.
